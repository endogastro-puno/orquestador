name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de Python
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Pruebas de regresión
        run: python -m unittest discover -s herramientas/tests -v

      - name: Frontera usuario/ vs herramientas/
        run: python herramientas/scripts/verificar_limites.py

      - name: Prueba de humo del motor
        run: python herramientas/scripts/selftest.py
